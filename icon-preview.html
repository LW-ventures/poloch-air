<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Icon-Vorschau</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; padding: 24px 16px; font-family: system-ui, sans-serif; background: #0b1830; color: #eef2f8; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p { margin: 0 0 20px; color: #93a6c6; font-size: 14px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 18px; }
  .v { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 16px 8px; border-radius: 16px; background: #152a4c; }
  .v b { font-size: 15px; }
  .big { width: 120px; height: 120px; border-radius: 26px; }
  .row { display: flex; gap: 10px; align-items: center; }
  .s60 { width: 60px; height: 60px; border-radius: 14px; }
  .s36 { width: 36px; height: 36px; border-radius: 9px; }
  .home { margin-top: 28px; padding: 22px 16px; border-radius: 20px; background: linear-gradient(160deg, #6b8fbf, #2c3e66); }
  .home .grid { grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .home figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 5px; font-size: 11px; }
  .home img { width: 62px; height: 62px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,.25); }
</style>
</head>
<body>
  <h1>Poloch Air – App-Icons</h1>
  <p>Vier Varianten in drei Größen. Unten: wie sie auf einem Homescreen wirken.</p>
  <div class="grid" id="g"></div>
  <div class="home"><div class="grid" id="h"></div></div>
<script>
  const v = [
    ['1', 'Detail + Sonne', 'icons/icon-1-detail.svg'],
    ['2', 'Orange + Flügel-Auto', 'icons/icon-2-orange-auto.svg'],
    ['3', 'Sonne + Flügel-Auto', 'icons/icon-3-sonne-auto.svg'],
    ['4', 'Orange + Flugzeug', 'icons/icon-4-orange-flugzeug.svg'],
  ];
  const t = Date.now();
  document.getElementById('g').innerHTML = v.map(([n, name, src]) => `
    <div class="v"><img class="big" src="${src}?${t}" alt=""><div class="row">
    <img class="s60" src="${src}?${t}" alt=""><img class="s36" src="${src}?${t}" alt=""></div><b>${n} · ${name}</b></div>`).join('');
  document.getElementById('h').innerHTML = v.map(([n, name, src]) => `<figure><img src="${src}?${t}" alt=""><figcaption>Variante ${n}</figcaption></figure>`).join('');
</script>
</body>
</html>
